# PLAT-7: pushing a version tag (e.g. 0.9.1, no "v") tests, builds and
# publishes a draft release with the three files Obsidian and BRAT install.
# A tag with a suffix (0.9.1-harshad.1), from a personal flavour branch, is
# a pre-release, so it never becomes the latest release others install.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the tag matches the manifest
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --draft $pre --title "$GITHUB_REF_NAME" --generate-notes
